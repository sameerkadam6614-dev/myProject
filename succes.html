<!DOCTYPE html>
<html>
<head>
  <title>Success</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    .success-box {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      width: 320px;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #28a745;
      color: white;
      font-size: 50px;
      line-height: 80px;
    }

    h2 {
      color: #28a745;
      margin-top: 20px;
    }

    p {
      color: #555;
    }

    button {
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="success-box">

    <div class="success-icon">✓</div>

    <h2>Data Saved Successfully!</h2>

    <p>Your information has been saved.</p>

    <button onclick="window.location.href='pro2.html'">
      OK
    </button>

  </div>

</body>
</html>
