<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f4f7;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 350px;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #007bff;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: 5px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #0056b3;
    }

    #success {
      color: green;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h2>Login</h2>

    <form id="loginForm">

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email">
        <div id="emailError" class="error"></div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">
        <div id="passwordError" class="error"></div>
      </div>

      <button  onclick="openPage()" type="submit" class="login-btn">
        Login
      </button>

      <div id="success"></div>

    </form>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {

      e.preventDefault();

      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value.trim();

      let emailError = document.getElementById("emailError");
      let passwordError = document.getElementById("passwordError");
      let success = document.getElementById("success");

      emailError.innerHTML = "";
      passwordError.innerHTML = "";
      success.innerHTML = "";

      let valid = true;

      // Email validation
      if (email === "") {
        emailError.innerHTML = "Email is required";
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailError.innerHTML = "Enter a valid email";
        valid = false;
      }

      // Password validation
      if (password === "") {
        passwordError.innerHTML = "Password is required";
        valid = false;
      } else if (password.length < 6) {
        passwordError.innerHTML = "Password must be at least 6 characters";
        valid = false;
      }

      if (valid) {
        success.innerHTML = "Login successful!";

        // Open admission form after login
        // window.location.href = "admission.html";
      }

    });
  </script>

<script>
        function openPage() {
            window.location.href = "form4.html";
        }
    </script>
</body>
</html>
